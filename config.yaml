# WattWise NILM - central configuration.
# All paths are relative to the project root (the folder containing this file).
# Every threshold used by the pipeline lives here so it can be changed in one place.

paths:
  raw_dir: REFIT_RAW_081116          # original raw REFIT CSVs (read-only)
  clean_dir: CLEAN_REFIT_081116      # original official cleaned REFIT CSVs (read-only)
  output_dir: outputs                # everything generated by the pipeline

# ---------------------------------------------------------------------------
# Task 1 - raw House 1 cleaning
# ---------------------------------------------------------------------------
raw_cleaning:
  house: 1
  # Channel names from the official readme (CLEAN_READ_ME_081116.txt, House 1).
  channel_names:
    Aggregate: Aggregate
    Appliance1: Fridge
    Appliance2: Freezer(1)
    Appliance3: Freezer(2)
    Appliance4: Washer Dryer
    Appliance5: Washing Machine
    Appliance6: Dishwasher
    Appliance7: Computer
    Appliance8: Television Site
    Appliance9: Electric Heater
  resample_freq: 1min
  # Raw timestamps are UK wall-clock time (verified: a backward jump at the
  # 2013-10-27 DST fall-back); they are converted to UTC like the official data.
  timezone: Europe/London
  # Day used for the before/after figure; "auto" picks the day with the most
  # corrected values that also contains washing-machine activity.
  plot_day: auto
  # Short gaps (consecutive unobserved minutes) up to this length are filled
  # by forward fill (consistent with the event-driven logging); longer gaps
  # are left as NaN and flagged as outages.
  short_gap_max_minutes: 5
  # Physical plausibility limits (W). A single-phase UK domestic supply is
  # typically fused at 60-100 A @ 230 V (~14-23 kW), so aggregate readings
  # above aggregate_max_w are physically implausible.
  aggregate_max_w: 20000
  # Official REFIT cleaning removes IAM spikes > 4000 W (IAM plugs are rated
  # 13 A ~ 3 kW). We flag & null them rather than set to 0.
  appliance_max_w: 4000
  plot_channels: [Aggregate, Appliance5, Appliance1, Appliance6]

# ---------------------------------------------------------------------------
# Tasks 2 & 3 - official cleaned data, washing machine
# ---------------------------------------------------------------------------
washing_machine:
  # House -> washing-machine column (from the official readme; only channels
  # labelled "Washing Machine", washer-dryers excluded).
  channels:
    2: Appliance2
    5: Appliance3
    7: Appliance5
    8: Appliance4
    9: Appliance3
    15: Appliance3
    16: Appliance5
    17: Appliance4
    18: Appliance5
  resample_freq: 1min
  # A minute with no reading in the official file is missing (outages appear as
  # gaps between rows; the official cleaning forward-filled only sensor NaNs).
  # Audit/repair the official time base against the raw files (see timebase.py).
  audit_timebase: true
  # Non-zero WM power that is exactly constant for this many minutes is a
  # forward-filled sensor dropout, not a real wash -> flagged "wm_stuck".
  stuck_minutes: 60

  # Every house whose readme lists a dedicated "Washing Machine" (screened in
  # Task 2; House 4 has two machines - Appliance4 is screened).
  all_channels: {1: Appliance5, 2: Appliance2, 3: Appliance6, 4: Appliance4, 5: Appliance3,
                 6: Appliance2, 7: Appliance5, 8: Appliance4, 9: Appliance3, 10: Appliance5,
                 11: Appliance3, 13: Appliance3, 15: Appliance3, 16: Appliance5, 17: Appliance4,
                 18: Appliance5, 19: Appliance2, 20: Appliance4, 21: Appliance3}

cycle_detection:
  on_threshold_w: 20         # minute is "active" if WM power >= this (standby is 0-5 W)
  max_gap_minutes: 10        # merge active runs separated by <= this many off minutes (soak/pause phases)
  min_duration_minutes: 15   # discard candidate events shorter than this
  min_energy_wh: 50          # discard candidate events using less energy than this
  min_peak_w: 300            # a real wash heats water or spins: require this peak
  max_duration_minutes: 360  # longer "cycles" are stuck sensors or other loads

eda:
  trace_house: 2
  example_cycle_houses: [2, 7, 9, 16]
  heating_w: 1000            # WM minutes above this are water heating
  peak_hours: [16, 19]       # GB evening network peak (local time), [start, end)
  sensitivity_thresholds_w: [10, 20, 50]
  sensitivity_gaps_min: [5, 10, 20]

# ---------------------------------------------------------------------------
# Task 3 - disaggregation model
# ---------------------------------------------------------------------------
model:
  train_houses: [2, 5, 7, 9, 15, 16]
  val_houses: [17]
  test_houses: [8, 18]
  random_state: 42
  # Training rows: every minute within +/- context_minutes of WM activity plus a
  # random off_sample_fraction of the remaining minutes (weighted 1/fraction so
  # the training distribution stays unbiased). Validation/test are never sampled.
  context_minutes: 60
  off_sample_fraction: 0.25
  active_threshold_w: 20     # on/off state for precision/recall/F1 (same as cycle detection)
  causal_ablation: true      # also train with past-only features
  temporal_experiment: true  # also test on the later 30% of the *training* houses
  temporal_split_fraction: 0.7
